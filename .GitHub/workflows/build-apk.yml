name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Auto-organize flat uploaded files (Mobile Fix)
      run: |
        mkdir -p app/src/main/java/com/example/modconverter
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/xml

        [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true
        [ -f "activity_main.xml" ] && mv activity_main.xml app/src/main/res/layout/activity_main.xml || true
        [ -f "file_paths.xml" ] && mv file_paths.xml app/src/main/res/xml/file_paths.xml || true
        [ -f "MainActivity.kt" ] && mv MainActivity.kt app/src/main/java/com/example/modconverter/MainActivity.kt || true
        [ -f "ModConverter.kt" ] && mv ModConverter.kt app/src/main/java/com/example/modconverter/ModConverter.kt || true

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.modconverter'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.modconverter"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
        }
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JavaToBedrockConverter-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
