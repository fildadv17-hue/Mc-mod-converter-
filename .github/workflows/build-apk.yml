name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Organize and Fix Files
      run: |
        mkdir -p app/src/main/java/com/example/modconverter
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/xml
        mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
        mv -f activity_main.xml app/src/main/res/layout/ 2>/dev/null || true
        mv -f file_paths.xml app/src/main/res/xml/ 2>/dev/null || true
        mv -f MainActivity.kt app/src/main/java/com/example/modconverter/ 2>/dev/null || true
        mv -f ModConverter.kt app/src/main/java/com/example/modconverter/ 2>/dev/null || true
        sed -i 's/\\././g' app/src/main/java/com/example/modconverter/ModConverter.kt
        sed -i ':a;N;$!ba;s/("\n/("\\n/g' app/src/main/java/com/example/modconverter/MainActivity.kt
        sed -i ':a;N;$!ba;s/\n")/\\n")/g' app/src/main/java/com/example/modconverter/ModConverter.kt
        printf 'plugins {\n id "com.android.application"\n id "org.jetbrains.kotlin.android"\n}\nandroid {\n namespace "com.example.modconverter"\n compileSdk 34\n defaultConfig {\n applicationId "com.example.modconverter"\n minSdk 26\n targetSdk 34\n versionCode 1\n versionName "1.0"\n }\n compileOptions {\n sourceCompatibility JavaVersion.VERSION_17\n targetCompatibility JavaVersion.VERSION_17\n }\n kotlinOptions {\n jvmTarget = "17"\n }\n}\ndependencies {\n implementation "androidx.core:core-ktx:1.12.0"\n implementation "androidx.appcompat:appcompat:1.6.1"\n implementation "com.google.android.material:material:1.11.0"\n implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"\n implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"\n}\n' > app/build.gradle
        printf 'plugins {\n id "com.android.application" version "8.2.2" apply false\n id "org.jetbrains.kotlin.android" version "1.9.22" apply false\n}\n' > build.gradle

    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - uses: actions/upload-artifact@v4
      with:
        name: JavaToBedrockConverter-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
